[package]
name = "review-center-optimizer"
version = "0.4.0"
edition = "2024"
license = "MIT"
[dependencies]
fsrs = "=6.6.2"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
opt-level = "s"
lto = true
strip = true
[patch.crates-io]
rayon = { path = "serial-rayon" }
